<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- أيقونة فرسان الحساب - Fursan Al-Hisab Favicon / App Icon -->
  <defs>
    <linearGradient id="fav-shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="fav-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="fav-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="fav-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- قاعدة الأيقونة الدائرية المربعة (Squircle Container) -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#fav-shield-bg)" />
  <rect x="3" y="3" width="94" height="94" rx="23" fill="none" stroke="url(#fav-rim)" stroke-width="1.8" />

  <!-- درع فارس الحساب (The Knight's Math Shield) -->
  <g id="shield-emblem">
    <!-- حافة الدرع الذهبية -->
    <path
      d="M 50 11 C 70 11, 85 19.5, 86 36.5 C 86 62.5, 66 80, 50 89 C 34 80, 14 62.5, 14 36.5 C 15 19.5, 30 11, 50 11 Z"
      fill="#0F172A"
      stroke="url(#fav-gold)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- شارة الإتقان العلوية (Crest Chevron) -->
    <path
      d="M 50 15 L 68 25 L 50 20 L 32 25 Z"
      fill="url(#fav-gold)"
    />

    <!-- علامة مصفوفة الضرب الحركية (×) ونجمة الإنجاز المركزية -->
    <g transform="translate(50, 52)">
      <!-- الجناح الأول (شمال شرق) - زمردي -->
      <path
        d="M 3 -3 L 18 -18 C 21 -21, 25 -19, 24 -15 L 18 -5 L 3 -3 Z"
        fill="url(#fav-emerald)"
      />
      <!-- الجناح الثاني (جنوب شرق) - أزرق ملكي -->
      <path
        d="M 3 3 L 18 18 C 21 21, 19 25, 15 24 L 5 18 L 3 3 Z"
        fill="url(#fav-indigo)"
      />
      <!-- الجناح الثالث (جنوب غرب) - زمردي فاتح -->
      <path
        d="M -3 3 L -18 18 C -21 21, -25 19, -24 15 L -18 5 L -3 3 Z"
        fill="url(#fav-emerald)"
      />
      <!-- الجناح الرابع (شمال غرب) - أزرق -->
      <path
        d="M -3 -3 L -18 -18 C -21 -21, -19 -25, -15 -24 L -5 -18 L -3 -3 Z"
        fill="url(#fav-indigo)"
      />

      <!-- المعين المركزي وقاعدة النجمة -->
      <rect
        x="-4"
        y="-4"
        width="8"
        height="8"
        rx="2"
        transform="rotate(45)"
        fill="#0F172A"
        stroke="url(#fav-gold)"
        stroke-width="1.5"
      />

      <!-- نجمة الإنجاز الذهبية المتلألئة في قلب رمز الضرب -->
      <path
        d="M 0 -8.5 Q 0 0 -8.5 0 Q 0 0 0 8.5 Q 0 0 8.5 0 Q 0 0 0 -8.5 Z"
        fill="url(#fav-gold)"
      />
      <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- نقطة الارتكاز الذهبية السفلية -->
    <polygon points="50,78 52.5,82 50,85 47.5,82" fill="url(#fav-gold)" />
  </g>
</svg>
